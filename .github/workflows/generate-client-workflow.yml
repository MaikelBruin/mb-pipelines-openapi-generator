name: OpenAPI Client Generation and Deploy workflow

on:
  workflow_call:
    inputs:
      workflow_id:
        required: true
        type: string
      openapi_spec_path:
        required: true
        type: string
      generator_config_file:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      package_version:
        required: true
        type: string
      # Set to false to build the client without publishing it. Used for variants
      # that only exist for comparison, and for configs whose pom.xml comes from
      # the stock templates.
      deploy:
        required: false
        type: boolean
        default: true

env:
  generator_version: '7.15.0'
  # The output location stays here rather than in the generator config: the upload
  # step below has to know where the generated code landed, so this workflow owns it.
  output_dir: 'target/generated-client'

jobs:
  generate-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate Java Jersey3 client
        # -w /local makes the container's working directory the checked-out repo
        # root. Without it the container cwd is /, so relative paths inside the
        # generator config (templateDir) resolve outside the mount and are lost.
        run: |
          docker run --rm -v "${{ github.workspace }}:/local" -w /local \
            openapitools/openapi-generator-cli:v${{ env.generator_version }} \
            generate \
            -i /local/${{ inputs.openapi_spec_path }} \
            -c /local/${{ inputs.generator_config_file }} \
            -o /local/${{ env.output_dir }} \
            --invoker-package mb.demos.openapi.generated.api.client.${{ inputs.package_name }}.client \
            --api-package mb.demos.openapi.generated.api.client.${{ inputs.package_name }}.api \
            --model-package mb.demos.openapi.generated.api.client.${{ inputs.package_name }}.model \
            --additional-properties=artifactId=${{ inputs.artifact_name }},artifactVersion=${{ inputs.package_version }}

      - name: Upload generated client code
        uses: actions/upload-artifact@v4
        with:
          name: generated-client-code-${{ inputs.workflow_id }}
          path: ${{ env.output_dir }}

  package-and-deploy-client:
    needs: generate-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for mvn deploy to push to this repository's GitHub Packages
      # registry. The caller must grant at least this much.
      packages: write
    steps:
      - name: Download generated client code
        uses: actions/download-artifact@v4
        with:
          name: generated-client-code-${{ inputs.workflow_id }}
      # setup-java writes ~/.m2/settings.xml with a server whose id is `github`
      # (its default), reading credentials from the GITHUB_ACTOR and GITHUB_TOKEN
      # environment variables. That id is what -DaltDeploymentRepository targets.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package client
        if: ${{ !inputs.deploy }}
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Package and deploy client to GitHub Packages
        if: ${{ inputs.deploy }}
        # The deploy target is passed here rather than hardcoded in
        # pom.mustache, so it also works for poms generated from the stock
        # templates (which have no distributionManagement block).
        run: |
          mvn --batch-mode --no-transfer-progress clean deploy \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
