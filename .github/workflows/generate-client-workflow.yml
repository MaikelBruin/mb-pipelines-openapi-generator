name: OpenAPI Client Generation and Deploy workflow

on:
  workflow_call:
    inputs:
      openapi_spec_path:
        required: true
        type: string
      generator_config_file:
        required: true
        type: string
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      package_version:
        required: true
        type: string
    secrets:
      personal_access_token:
        required: true

env:
  generator_version: '7.15.0'
  # The output location stays here rather than in the generator config: the upload
  # step below has to know where the generated code landed, so this workflow owns it.
  output_dir: 'target/generated-client'

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate Java Jersey3 client
        # -w /local makes the container's working directory the checked-out repo
        # root. Without it the container cwd is /, so relative paths inside the
        # generator config (templateDir) resolve outside the mount and are lost.
        run: |
          docker run --rm -v "${{ github.workspace }}:/local" -w /local \
            openapitools/openapi-generator-cli:v${{ env.generator_version }} \
            generate \
            -i /local/${{ inputs.openapi_spec_path }} \
            -c /local/${{ inputs.generator_config_file }} \
            -o /local/${{ env.output_dir }} \
            --invoker-package mb.demos.openapi.generated.api.client.${{ inputs.package_name }}.client \
            --api-package mb.demos.openapi.generated.api.client.${{ inputs.package_name }}.api \
            --model-package mb.demos.openapi.generated.api.client.${{ inputs.package_name }}.model \
            --additional-properties=artifactId=${{ inputs.app_name }},artifactVersion=${{ inputs.package_version }}

      - name: Upload generated client code
        uses: actions/upload-artifact@v4
        with:
          name: generated-client-code-${{ inputs.app_name }}
          path: ${{ env.output_dir }}

  package-and-deploy-client:
    needs: generate-client
    runs-on: ubuntu-latest
    steps:
      - name: Download generated client code
        uses: actions/download-artifact@v4
        with:
          name: generated-client-code-${{ inputs.app_name }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        #please note that the deployment configuration is set in the pom.mustache template
      - name: Deploy artifact to maven repository
        run: |
          mvn clean package deploy -Dusername=${{ github.actor }} -Dpassword=$GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.personal_access_token }}
